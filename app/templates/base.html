<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Predykcja cukrzycy{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-teal">
    <div class="container">
      <a class="navbar-brand" href="/">Predykcja cukrzycy</a>
      <div class="d-flex gap-3">
        <a class="nav-link {% if active == 'home' %}active{% endif %}" href="/">Start</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="container pb-4 text-muted small">
    Aplikacja ma charakter edukacyjny. Wynik nie jest diagnozą medyczną.
    <a href="/docs">Dokumentacja API</a>
  </footer>
</body>
</html>
